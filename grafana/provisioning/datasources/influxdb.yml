apiVersion: 1

datasources:
  - name: Solar-InfluxDB
    uid: solar-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: true

    jsonData:
      version: Flux
      organization: solar-lab
      defaultBucket: energy

    secureJsonData:
      token: $INFLUXDB_TOKEN